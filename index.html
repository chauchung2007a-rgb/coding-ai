<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Coding AI</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    background: #f7f7f8;
      color: #222;
    }


    /* =========================
       HEADER
    ========================= */

       header {
      height: 58px;
      background: #ffffff;
      color: #111;


      display: flex;
      align-items: center;

      padding: 0 12px;

      font-size: 18px;
      font-weight: 600;

      position: relative;
      z-index: 20;
    }


       .menu-button,
    .more-button {
      width: 40px;
      height: 40px;

      border: none;
      background: transparent;
      color: #111;


      border-radius: 10px;

      font-size: 23px;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }


    .menu-button:active,
    .more-button:active {
      background: rgba(255,255,255,0.12);
    }


    .header-title {
      flex: 1;
      padding-left: 5px;
    }


    /* =========================
       MAIN CHAT
    ========================= */

 main {
  position: absolute;

  top: 58px;
  left: 0;
  right: 0;
  bottom: 0;

  overflow-y: auto;

  padding: 16px 12px 100px;

  background: #f7f7f8;
}



    .welcome {
      max-width: 650px;

      margin: 80px auto 0;

      text-align: center;
    }


    .welcome h1 {
      font-size: 28px;
      margin: 0 0 10px;
      font-weight: 600;
    }


    .welcome p {
      color: #777;
      line-height: 1.6;
      margin: 0;
    }


    /* =========================
       MESSAGES
    ========================= */

  .message {
  max-width: 800px;

  margin: 12px auto;

  padding: 12px 14px;

  border-radius: 24px;

  line-height: 1.6;

  white-space: pre-wrap;

  word-wrap: break-word;

  border: none;
}


.message.user {
  background: #e8f0fe;

  border: none;
}

.message.ai {
  background: transparent;

  border: none;
}



    /* =========================
       INPUT AREA
    ========================= */

    .input-area {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  background: linear-gradient(
    to bottom,
    rgba(247, 247, 248, 0) 0%,
    rgba(247, 247, 248, 0.85) 35%,
    rgba(247, 247, 248, 1) 60%
  );

  padding: 20px 10px 10px;

  z-index: 15;
}




    .input-box {
      max-width: 800px;

      margin: 0 auto;

      position: relative;

      display: flex;
      align-items: center;
    }


   textarea {
  width: 100%;

  height: 48px;
  min-height: 48px;
  max-height: 120px;

  resize: none;

  border: none;

 border-radius: 24px;

  outline: none;

 background: #ffffff;

      padding: 13px 82px 12px 46px;

      font-size: 16px;

      line-height: 1.4;

      overflow-y: auto;
    }


   


    /* =========================
       PLUS BUTTON
    ========================= */

    .plus-button {
      position: absolute;

      left: 7px;
      top: 7px;

      width: 34px;
      height: 34px;

      border: none;

      border-radius: 50%;

      background: transparent;

      color: #555;

      font-size: 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      z-index: 2;
    }


    .plus-button:active {
      background: #eee;
    }


    /* =========================
       SEND BUTTON
    ========================= */

    .send-button {
      position: absolute;

      right: 7px;
      top: 7px;

      width: 34px;
      height: 34px;

      border: none;

      border-radius: 50%;

      background: #111;

      color: white;

      font-size: 17px;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }


    .send-button:active {
      transform: scale(0.94);
      opacity: 0.7;
    }


    .send-button:disabled {
      opacity: 0.45;
      cursor: default;
    }


   /* =========================
   SIDE MENU - GLASS
========================= */

.menu-overlay {
  position: fixed;

  inset: 0;

  background: rgba(0, 0, 0, 0.25);

  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);

  opacity: 0;
  visibility: hidden;

  transition: 0.25s;

  z-index: 30;
}


.menu-overlay.open {
  opacity: 1;
  visibility: visible;
}

.side-menu {
  position: absolute;

  top: 0;
  left: 0;

  width: min(290px, 82vw);
  height: 100%;

  background: #ffffff;

  border: none;


  border-radius: 0;

  box-shadow:
    0 20px 50px rgba(0, 0, 0, 0.20),
    inset 0 1px 0 rgba(255, 255, 255, 0.75);

  overflow: hidden;

  transform: translateX(-100%);

  transition: transform 0.25s ease;

  display: flex;
  flex-direction: column;
}

.menu-overlay.open .side-menu {
  transform: translateX(0);
}


.menu-header {
  height: 58px;

  display: flex;
  align-items: center;

  padding: 0 12px;

  border-bottom: 1px solid #000;

  font-weight: 600;
  font-size: 18px;

  background: #ffffff;
}


.menu-close {
  width: 40px;
  height: 40px;

  border: none;

  background: rgba(255, 255, 255, 0.18);

  color: #111;

  font-size: 23px;

  border-radius: 12px;

  margin-right: 5px;

  cursor: pointer;

  transition: 0.15s;
}


.menu-close:active {
  background: rgba(255, 255, 255, 0.35);
}

.menu-content {
  padding: 12px;

  display: flex;
  flex-direction: column;

  flex: 1;

  box-sizing: border-box;
}


.menu-item {
  width: 100%;

  min-height: 48px;

  border: 1px solid transparent;

  background: transparent;

  border-radius: 14px;

  display: flex;
  align-items: center;

  padding: 0 12px;

  font-size: 16px;

  color: #111;

  text-align: left;

  cursor: pointer;

  transition: 0.15s;
}



.menu-item.new-chat {
  color: #000;
  margin-top: auto;
}


.menu-item:active {
  background: rgba(255, 255, 255, 0.35);

  border-color: rgba(255, 255, 255, 0.35);
}


.menu-item span {
  margin-left: 10px;
}


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        height: 56px;
      }

           main {
        top: 56px;
        bottom: 0;

        padding-left: 10px;
        padding-right: 10px;
        padding-bottom: 100px;
      }


      .welcome {
        margin-top: 70px;
      }

      .welcome h1 {
        font-size: 25px;
      }

           .input-area {
        padding: 20px 8px 9px;
      }


      textarea {
        height: 46px;
        min-height: 46px;

        padding-top: 12px;

        font-size: 16px;
      }

      .plus-button,
      .send-button {
        top: 6px;
      }
    }

  </style>
</head>


  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <button
      class="menu-button"
      id="menuButton"
      aria-label="Menu"
    >
      ☰
    </button>

    <div class="header-title">
      Coding AI
    </div>

   
         <button
      class="more-button"
      aria-label="More"
      onclick="renameCurrentChat()"
    >
      ⋯
    </button>



  </header>



  <!-- =========================
       CHAT
  ========================== -->

  <main id="chat">

    <div class="welcome">

      <h1>How can I help?</h1>

      <p>
        សរសេរកូដ កែ Code ឬពន្យល់ Code
      </p>

    </div>

  </main>



  <!-- =========================
       INPUT
  ========================== -->

  <div class="input-area">

    <div class="input-box">

      <button
        class="plus-button"
        id="plusButton"
        type="button"
        aria-label="Add"
      >
        ＋
      </button>


      <textarea
        id="messageInput"
        placeholder="Message Coding AI..."
      ></textarea>


      <button
        class="send-button"
        id="sendButton"
        type="button"
        onclick="sendMessage()"
        aria-label="Send"
      >
        ➤
      </button>

    </div>

  </div>



  <!-- =========================
       SIDE MENU
  ========================== -->

  <div
    class="menu-overlay"
    id="menuOverlay"
  >

    <div
      class="side-menu"
      id="sideMenu"
    >

      <div class="menu-header">

        <button
          class="menu-close"
          id="menuClose"
          type="button"
        >
          ×
        </button>

        <span>Coding AI</span>

      </div>


     <div class="menu-content">



  


  


     <button class="menu-item" type="button" onclick="openSettings()">
    <img src="settings-icon.png" alt="Settings" style="width:20px; height:20px; object-fit:contain;">
    <span>Settings</span>
  </button>




   <div id="chatListContainer"></div>

     <div style="margin-top:auto;">

    <hr style="width:100%; border:none; border-top:1px solid #000; margin:0 0 8px 0;">

    <button
      class="menu-item new-chat"
      type="button"
      onclick="createNewChat()"
      style="margin-top:0;"
    >
      ＋
      <span>New Chat</span>
    </button>

  </div>




</div>

    </div>

  </div>


<script>

  /* =========================
     ELEMENTS
  ========================== */

  const messageInput =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");

  const chat =
    document.getElementById("chat");

  const menuButton =
    document.getElementById("menuButton");

  const menuClose =
    document.getElementById("menuClose");

  const menuOverlay =
    document.getElementById("menuOverlay");


  /* =========================
     CHAT HISTORY STORAGE
  ========================== */

  const CHAT_STORAGE_KEY =
    "codingAI_chats";

  const CURRENT_CHAT_KEY =
    "codingAI_currentChat";


  function getChats() {

    try {

      const data =
        localStorage.getItem(
          CHAT_STORAGE_KEY
        );

      if (!data) return [];

      const chats =
        JSON.parse(data);

      return Array.isArray(chats)
        ? chats
        : [];

    } catch (error) {

      console.error(
        "Chat storage read error:",
        error
      );

      return [];

    }

  }


  function saveChats(chats) {

    try {

      localStorage.setItem(
        CHAT_STORAGE_KEY,
        JSON.stringify(chats)
      );

      return true;

    } catch (error) {

      console.error(
        "Chat storage save error:",
        error
      );

      return false;

    }

  }


  function getCurrentChatId() {

    try {

      return localStorage.getItem(
        CURRENT_CHAT_KEY
      );

    } catch (error) {

      console.error(
        "Current chat read error:",
        error
      );

      return null;

    }

  }


  function setCurrentChatId(id) {

    try {

      if (id) {

        localStorage.setItem(
          CURRENT_CHAT_KEY,
          id
        );

      } else {

        localStorage.removeItem(
          CURRENT_CHAT_KEY
        );

      }

    } catch (error) {

      console.error(
        "Current chat save error:",
        error
      );

    }

  }


  function generateChatId() {

    return (
      "chat_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2, 8)
    );

  }


  function getCurrentChat() {

    const currentId =
      getCurrentChatId();

    if (!currentId) return null;

    const chats =
      getChats();

    return (
      chats.find(
        chatItem =>
          chatItem.id === currentId
      ) || null
    );

  }


  /* =========================
     CHAT SESSION MANAGEMENT
  ========================== */

 function createNewChat() {

  const newChat = {

    id: generateChatId(),

    title: "New Chat",

    createdAt:
      new Date().toISOString(),

    updatedAt:
      new Date().toISOString(),

    messages: []

  };


  const chats =
    getChats();


  chats.unshift(newChat);


  saveChats(chats);


  setCurrentChatId(
    newChat.id
  );


  /* =========================
     SHOW NEW CHAT
  ========================== */

  renderMessages(
    newChat.messages
  );


   /* =========================
     CLOSE MENU
  ========================== */

  renderChatList();

  menuOverlay.classList.remove(
    "open"
  );



  /* =========================
     RESET INPUT
  ========================== */

  messageInput.value = "";

  messageInput.style.height =
    "48px";


  messageInput.focus();


  return newChat;

}


  /* =========================
     SAVE MESSAGE
  ========================== */

  function addMessageToCurrentChat(
    role,
    text
  ) {

    let currentChat =
      getCurrentChat();


    if (!currentChat) {

      currentChat =
        createNewChat();

    }


    const chats =
      getChats();


    const chatIndex =
      chats.findIndex(
        chatItem =>
          chatItem.id ===
          currentChat.id
      );


    if (chatIndex === -1) return;


    chats[chatIndex].messages.push({

      role: role,

      text: text,

      timestamp:
        new Date().toISOString()

    });


    chats[chatIndex].updatedAt =
      new Date().toISOString();


    if (
      role === "user" &&
      chats[chatIndex].title ===
        "New Chat"
    ) {

      chats[chatIndex].title =
        text.length > 40
          ? text.slice(0, 40) + "..."
          : text;

    }


    saveChats(chats);


    setCurrentChatId(
      chats[chatIndex].id
    );

  }


 /* =========================
   RENDER SAVED MESSAGES
========================= */

function renderMessages(
  messages
) {

  chat.innerHTML = "";


  if (
    !messages ||
    messages.length === 0
  ) {

    chat.innerHTML = `
      <div class="welcome">
        <h1>How can I help?</h1>
        <p>សរសេរកូដ កែ Code ឬពន្យល់ Code</p>
      </div>
    `;

    return;

  }


  messages.forEach(
    function(message) {

      const messageElement =
        document.createElement(
          "div"
        );


      messageElement.className =
        "message " +
        (
          message.role === "user"
            ? "user"
            : "ai"
        );


      const text =
        message.text || "";


      /* =========================
         CODE BLOCK
      ========================== */

   const codeBlockRegex =
  /```([\w+-]*)\s*([\s\S]*?)```/g;


      let lastIndex = 0;

      let match;

    


      while (
        (match =
          codeBlockRegex.exec(text))
        !== null
      ) {

        /* TEXT BEFORE CODE */

        const beforeText =
          text.slice(
            lastIndex,
            match.index
          );


        if (beforeText) {

          messageElement.appendChild(
            document.createTextNode(
              beforeText
            )
          );

        }


       /* CODE CONTAINER */

const codeContainer =
  document.createElement(
    "div"
  );

const languageLabel =
  document.createElement("div");

languageLabel.textContent =
  match[1] || "code";

languageLabel.style.position =
  "absolute";

languageLabel.style.top =
  "8px";

languageLabel.style.left =
  "12px";

languageLabel.style.color =
  "#ccc";

languageLabel.style.fontSize =
  "12px";

languageLabel.style.zIndex =
  "10";

codeContainer.style.position =
  "relative";

codeContainer.style.margin =
  "10px 0";

codeContainer.style.overflow =
  "hidden";


        /* COPY BUTTON */

        const copyButton =
          document.createElement(
            "button"
          );

       copyButton.textContent =
  "COPY";

        copyButton.style.position =
          "absolute";

       copyButton.style.top = "8px";
copyButton.style.right = "12px";

        copyButton.style.border =
          "none";

        copyButton.style.borderRadius =
          "8px";

        copyButton.style.padding =
          "5px 9px";

        copyButton.style.background =
          "#333";

        copyButton.style.color =
          "#fff";

        copyButton.style.fontSize =
          "12px";

        copyButton.style.cursor =
          "pointer";
        copyButton.style.zIndex =
  "10";


       /* CODE */
const codeElement = document.createElement("pre");

codeElement.style.margin = "0";
codeElement.style.padding = "42px 12px 12px 52px";

codeElement.style.background = "#e0e0e0";
codeElement.style.color = "#222";

codeElement.style.borderRadius = "12px";

codeElement.style.overflowX = "auto";
codeElement.style.overflowY = "auto";
codeElement.style.maxWidth = "100%";

codeElement.style.maxHeight = "50vh";

codeElement.style.boxSizing = "border-box";
codeElement.style.webkitOverflowScrolling = "touch";

codeElement.style.touchAction = "pan-y";

codeElement.style.whiteSpace = "pre-wrap";

codeElement.textContent = match[2];


/* COPY FUNCTION */
copyButton.addEventListener("click", async function() {
  try {
    await navigator.clipboard.writeText(codeElement.textContent);
   

    copyButton.textContent = "✓ Copied";

    setTimeout(function() {
      copyButton.textContent = "COPY";
    }, 1500);



  } catch (error) {
    console.error("Copy failed:", error);
  }
});

codeContainer.appendChild(languageLabel);
codeContainer.appendChild(copyButton);
codeContainer.appendChild(codeElement);


        messageElement.appendChild(
          codeContainer
        );


        lastIndex =
          codeBlockRegex.lastIndex;

      }


     /* TEXT AFTER LAST CODE BLOCK */

const remainingText =
  text.slice(
    lastIndex
  );

if (remainingText) {

  messageElement.appendChild(
    document.createTextNode(
      remainingText
    )
  );

}

      chat.appendChild(
        messageElement
      );

    }
  );


  chat.scrollTop =
    chat.scrollHeight;

}


  /* =========================
     LOAD CURRENT CHAT
  ========================== */

  function loadCurrentChat() {

    const currentChat =
      getCurrentChat();


    if (!currentChat) {

      renderMessages([]);

      return;

    }


    renderMessages(
      currentChat.messages
    );

  }


  /* =========================
     RENDER CHAT LIST (SIDE MENU)
  ========================== */

  function renderChatList() {

    const container =
      document.getElementById("chatListContainer");

    if (!container) return;

       const chats =
      getChats().filter(c => !c.deletedAt);

    container.innerHTML = "";

    chats.forEach(function(chatItem) {


      const row = document.createElement("button");
      row.className = "menu-item";
      row.type = "button";
      row.style.justifyContent = "space-between";

      const titleSpan = document.createElement("span");
      titleSpan.textContent = chatItem.title;
      titleSpan.style.overflow = "hidden";
      titleSpan.style.textOverflow = "ellipsis";
      titleSpan.style.whiteSpace = "nowrap";

      row.appendChild(titleSpan);

      const deleteBtn = document.createElement("span");
      deleteBtn.textContent = "🗑";
      deleteBtn.style.marginLeft = "8px";

      row.appendChild(deleteBtn);

      row.addEventListener("click", function(event) {

               if (event.target === deleteBtn) {

          const allChats = getChats();

          const targetIndex =
            allChats.findIndex(c => c.id === chatItem.id);

          if (targetIndex !== -1) {
            allChats[targetIndex].deletedAt =
              new Date().toISOString();
          }

          saveChats(allChats);

          if (getCurrentChatId() === chatItem.id) {
            setCurrentChatId(null);
            renderMessages([]);
          }

          renderChatList();

        } else {


          setCurrentChatId(chatItem.id);
          renderMessages(chatItem.messages);
          menuOverlay.classList.remove("open");

        }

      });

      container.appendChild(row);

    });

  }



  /* =========================
     OPEN CHATS LIST
  ========================== */

  function openChatsList() {

    const chats = getChats();

    chat.innerHTML = "";

    if (chats.length === 0) {

      chat.innerHTML = `
        <div class="welcome">
          <h1>No chats yet</h1>
          <p>ចាប់ផ្តើមជជែកថ្មីមួយ</p>
        </div>
      `;

    } else {

      chats.forEach(function(chatItem) {

        const row = document.createElement("div");
        row.className = "message ai";
        row.style.cursor = "pointer";
        row.style.display = "flex";
        row.style.justifyContent = "space-between";
        row.style.alignItems = "center";

        const titleSpan = document.createElement("span");
        titleSpan.textContent = chatItem.title;

        row.addEventListener("click", function() {
          setCurrentChatId(chatItem.id);
          renderMessages(chatItem.messages);
          menuOverlay.classList.remove("open");
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "🗑";
        deleteBtn.style.border = "none";
        deleteBtn.style.background = "transparent";
        deleteBtn.style.cursor = "pointer";
        deleteBtn.style.fontSize = "16px";

        deleteBtn.addEventListener("click", function(event) {
          event.stopPropagation();
          const updatedChats = getChats().filter(c => c.id !== chatItem.id);
          saveChats(updatedChats);
          if (getCurrentChatId() === chatItem.id) {
            setCurrentChatId(null);
          }
          openChatsList();
        });

        row.appendChild(titleSpan);
        row.appendChild(deleteBtn);
        chat.appendChild(row);

      });

    }

    menuOverlay.classList.add("open");

  }


  /* =========================
     MENU
  ========================== */

   menuButton.addEventListener(
    "click",
    function() {

      renderChatList();

      menuOverlay.classList.add(
        "open"
      );

    }
  );



  menuClose.addEventListener(
    "click",
    function() {

      menuOverlay.classList.remove(
        "open"
      );

    }
  );


  menuOverlay.addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        menuOverlay
      ) {

        menuOverlay.classList.remove(
          "open"
        );

      }

    }
  );


  /* =========================
     TEXTAREA
  ========================== */

  messageInput.addEventListener(
    "input",
    function() {

      this.style.height =
        "48px";


      this.style.height =
        Math.min(
          this.scrollHeight,
          120
        ) + "px";

    }
  );


  messageInput.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /* =========================
     SEND MESSAGE
  ========================== */

  async function sendMessage() {

    const message =
      messageInput.value.trim();


    if (!message) return;


    /* =========================
       SAVE USER MESSAGE
    ========================== */

    addMessageToCurrentChat(
      "user",
      message
    );


    const welcome =
      document.querySelector(
        ".welcome"
      );


    if (welcome) {

      welcome.remove();

    }


    /* =========================
       USER MESSAGE UI
    ========================== */

    const userMessage =
      document.createElement(
        "div"
      );


    userMessage.className =
      "message user";


    userMessage.textContent =
      message;


    chat.appendChild(
      userMessage
    );


    /* =========================
       AI LOADING UI
    ========================== */

    const aiMessage =
      document.createElement(
        "div"
      );


    aiMessage.className =
      "message ai";


    aiMessage.textContent =
      "⏳ Coding AI កំពុងគិត...";


    chat.appendChild(
      aiMessage
    );


    messageInput.value =
      "";


    messageInput.style.height =
      "48px";


    chat.scrollTop =
      chat.scrollHeight;


   sendButton.disabled =
  true;


/* =========================
   CONVERSATION CONTEXT
========================= */

const currentChat =
  getCurrentChat();

const conversationHistory =
  currentChat &&
  Array.isArray(currentChat.messages)
    ? currentChat.messages
        .slice(0, -1)
        .map(item => ({
          role: item.role,
          text: item.text
        }))
    : [];


/* =========================
   PAST CHATS CONTEXT
   (only gathered when the user
   seems to reference an old chat)
========================= */

const pastChatKeywords = [
  "លើកមុន",
  "ដូចធ្លាប់",
  "ធ្លាប់សួរ",
  "ចាំបានទេ",
  "last time",
  "before",
  "previously"
];

const wantsPastChats =
  pastChatKeywords.some(keyword =>
    message.toLowerCase().includes(keyword.toLowerCase())
  );

let pastChatsContext = "";

if (wantsPastChats) {

  const otherChats =
    getChats().filter(c =>
      !currentChat || c.id !== currentChat.id
    );

  const snippets = [];

  otherChats.forEach(function(c) {

    const text =
      (c.messages || [])
        .map(m => m.role + ": " + m.text)
        .join("\n");

    snippets.push(
      "===== " + c.title + " =====\n" + text
    );

  });

  pastChatsContext =
    snippets.join("\n\n").slice(0, 6000);

}



try {

      /*
        រក្សា API route ដើម
        មិនប្តូរទៅ URL ផ្សេងទេ
      */

      const response =
        await fetch(
          "/api/chat",
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

                   body: JSON.stringify({
  message: message,
  languagePreference:
    localStorage.getItem("languagePreference") || "auto",
  conversationHistory:
    conversationHistory,
  pastChatsContext:
    pastChatsContext
})


          }
        );


      let data;


      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          "Server មិនបានផ្ញើទិន្នន័យត្រឹមត្រូវ។"
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          "មានបញ្ហាក្នុងការភ្ជាប់ AI"
        );

      }


      /* =========================
         SHOW AI RESPONSE
      ========================== */

     const aiReply =
  data.reply ||
  "AI មិនបានផ្ញើចម្លើយមកទេ។";

aiMessage.textContent =
  aiReply;


      /* =========================
         SAVE AI MESSAGE
      ========================== */

   addMessageToCurrentChat(
  "ai",
  aiReply
);

renderMessages(
  getCurrentChat().messages
);


    } catch (error) {

      console.error(
        "Chat error:",
        error
      );


      aiMessage.textContent =
        "❌ មានបញ្ហា៖ " +
        error.message;

    }


    sendButton.disabled =
      false;


    chat.scrollTop =
      chat.scrollHeight;

  }

 
  /* =========================
     RENAME CURRENT CHAT
  ========================== */

  function renameCurrentChat() {

    const currentChat = getCurrentChat();

    if (!currentChat) {
      alert("សូមចាប់ផ្តើមឬបើកសន្ទនាមួយសិន។");
      return;
    }

    const newTitle = prompt(
      "ដាក់ឈ្មោះថ្មីសម្រាប់សន្ទនានេះ៖",
      currentChat.title
    );

    if (!newTitle || !newTitle.trim()) return;

    const chats = getChats();

    const chatIndex = chats.findIndex(
      c => c.id === currentChat.id
    );

    if (chatIndex === -1) return;

    chats[chatIndex].title = newTitle.trim();

    saveChats(chats);
    renderChatList();

  }


 
  /* =========================
     SETTINGS: LANGUAGE PREFERENCE
  ========================== */

  function openSettings() {

    const current =
      localStorage.getItem("languagePreference") || "auto";

    const choice = prompt(
      "ជ្រើសរើសភាសាចម្លើយ៖\n" +
      "វាយ km = ខ្មែរ\n" +
      "វាយ vi = វៀតណាម\n" +
      "វាយ en = អង់គ្លេស\n" +
      "វាយ auto = ស្វែងរកដោយស្វ័យប្រវត្តិ",
      current
    );

    if (!choice) return;

    const trimmed = choice.trim().toLowerCase();

    if (["km", "vi", "en", "auto"].includes(trimmed)) {
      localStorage.setItem("languagePreference", trimmed);
      alert("បានរក្សាទុក! ភាសា: " + trimmed);
    } else {
      alert("សូមវាយ km, vi, en, ឬ auto ប៉ុណ្ណោះ។");
    }

    menuOverlay.classList.remove("open");

  }


 
  /* =========================
     PURGE OLD DELETED CHATS
     (permanently remove after 30 days)
  ========================== */

  function purgeOldDeletedChats() {

    const ONE_MONTH_MS = 30 * 24 * 60 * 60 * 1000;

    const now = Date.now();

    const remainingChats =
      getChats().filter(function(chatItem) {

        if (!chatItem.deletedAt) return true;

        const deletedTime =
          new Date(chatItem.deletedAt).getTime();

        return (now - deletedTime) < ONE_MONTH_MS;

      });

    saveChats(remainingChats);

  }


  /* =========================
     STARTUP
  ========================== */

  purgeOldDeletedChats();
  loadCurrentChat();
  renderChatList();




 


</script>
