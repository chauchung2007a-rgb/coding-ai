<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coding AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 58px;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 20px;
      font-weight: bold;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .welcome {
      max-width: 700px;
      margin: 40px auto;
      text-align: center;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #666;
      line-height: 1.6;
    }

    .message {
      max-width: 800px;
      margin: 12px auto;
      padding: 14px;
      border-radius: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user {
      background: #e8f0fe;
    }

    .ai {
      background: white;
      border: 1px solid #ddd;
    }

    .input-area {
      background: white;
      border-top: 1px solid #ddd;
      padding: 12px;
    }

    .input-box {
      max-width: 800px;
      margin: auto;
      display: flex;
      gap: 8px;
    }

    textarea {
      flex: 1;
      min-height: 50px;
      max-height: 160px;
      resize: vertical;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 55px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      header {
        font-size: 18px;
      }

      main {
        padding: 10px;
      }

      .welcome {
        margin: 30px auto;
      }
    }
  </style>
</head>

<body>

  <header>
    💻 Coding AI
  </header>

  <main id="chat">
    <div class="welcome">
      <h1>💻 Coding AI</h1>
      <p>
        សួស្តី! ខ្ញុំជា Coding AI របស់អ្នក។<br>
        ខ្ញុំនឹងផ្តោតលើការសរសេរ កែ និងពន្យល់កូដ។
      </p>
    </div>
  </main>

  <div class="input-area">
    <div class="input-box">
      <textarea
        id="messageInput"
        placeholder="សរសេរសំណួរ ឬបញ្ចូល Code..."
      ></textarea>

      <button onclick="sendMessage()">➤</button>
    </div>
  </div>

<script>
  async function sendMessage() {
    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");

    const message = input.value.trim();

    if (!message) return;

    const welcome = document.querySelector(".welcome");
    if (welcome) {
      welcome.remove();
    }

    // បង្ហាញសំណួររបស់អ្នក
    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = message;
    chat.appendChild(userMessage);

    // បង្ហាញកំពុងគិត
    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";
    aiMessage.textContent = "⏳ Coding AI កំពុងគិត...";
    chat.appendChild(aiMessage);

    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    try {

      const response = await fetch("https://coding-ai-six.vercel.app/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "មានបញ្ហាក្នុងការភ្ជាប់ AI");
      }

      aiMessage.textContent = data.reply || "AI មិនបានផ្ញើចម្លើយមកទេ។";

    } catch (error) {
      console.error(error);

      aiMessage.textContent =
        "❌ មានបញ្ហា៖ " + error.message;
    }

    chat.scrollTop = chat.scrollHeight;
  }
</script>
  

</body>
</html>
