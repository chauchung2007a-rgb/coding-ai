<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coding AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 58px;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 20px;
      font-weight: bold;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .welcome {
      max-width: 700px;
      margin: 40px auto;
      text-align: center;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #666;
      line-height: 1.6;
    }

    .message {
      max-width: 800px;
      margin: 12px auto;
      padding: 14px;
      border-radius: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user {
      background: #e8f0fe;
    }

    .ai {
      background: white;
      border: 1px solid #ddd;
    }

    .input-area {
      background: white;
      border-top: 1px solid #ddd;
      padding: 10px 12px;
    }

    .input-box {
      max-width: 800px;
      margin: auto;
      position: relative;
      display: flex;
      align-items: flex-end;
    }

    textarea {
      width: 100%;
      min-height: 52px;
      max-height: 160px;
      resize: none;
      border: 1px solid #ccc;
      border-radius: 28px;
      padding: 14px 58px 14px 16px;
      font-size: 16px;
      outline: none;
      background: #f8f8f8;
      line-height: 1.4;
    }

    textarea:focus {
      border-color: #999;
      background: white;
    }

    button {
      position: absolute;
      right: 7px;
      bottom: 7px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: #111;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      opacity: 0.7;
      transform: scale(0.95);
    }

    @media (max-width: 600px) {
      header {
        font-size: 18px;
      }

      main {
        padding: 10px;
      }

      .welcome {
        margin: 30px auto;
      }

      .input-area {
        padding: 8px 10px;
      }

      textarea {
        min-height: 50px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    💻 Coding AI
  </header>

  <main id="chat">
    <div class="welcome">
      <h1>💻 Coding AI</h1>
      <p>
        សួស្តី! ខ្ញុំជា Coding AI របស់អ្នក។<br>
        ខ្ញុំនឹងផ្តោតលើការសរសេរ កែ និងពន្យល់កូដ។
      </p>
    </div>
  </main>

  <div class="input-area">
    <div class="input-box">

      <textarea
        id="messageInput"
        placeholder="សរសេរសំណួរ ឬបញ្ចូល Code..."
      ></textarea>

      <button id="sendButton" onclick="sendMessage()">➤</button>

    </div>
  </div>

<script>

  const messageInput = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");

  messageInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }

  });


  async function sendMessage() {

    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");

    const message = input.value.trim();

    if (!message) return;


    const welcome = document.querySelector(".welcome");

    if (welcome) {
      welcome.remove();
    }


    // User message
    const userMessage = document.createElement("div");

    userMessage.className = "message user";
    userMessage.textContent = message;

    chat.appendChild(userMessage);


    // AI loading message
    const aiMessage = document.createElement("div");

    aiMessage.className = "message ai";
    aiMessage.textContent = "⏳ Coding AI កំពុងគិត...";

    chat.appendChild(aiMessage);


    input.value = "";

    chat.scrollTop = chat.scrollHeight;


    // Disable send button while waiting
    sendButton.disabled = true;


    try {

      const response = await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: message
        })

      });


      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error("Server មិនបានផ្ញើទិន្នន័យត្រឹមត្រូវ។");
      }


      if (!response.ok) {

        throw new Error(
          data.error || "មានបញ្ហាក្នុងការភ្ជាប់ AI"
        );

      }


      aiMessage.textContent =
        data.reply || "AI មិនបានផ្ញើចម្លើយមកទេ។";


    } catch (error) {

      console.error("Chat error:", error);

      aiMessage.textContent =
        "❌ មានបញ្ហា៖ " + error.message;

    }


    sendButton.disabled = false;

    chat.scrollTop = chat.scrollHeight;

  }

</script>

</body>
</html>
